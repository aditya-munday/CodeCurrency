[workspace]
resolver = "2"
members = ["crates/ccx-core", "crates/ccx-cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "Apache-2.0"
repository = "https://github.com/aditya-munday/CodeCurrency"

[workspace.dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
hex = "0.4"

[profile.release]
opt-level = 2
debug = false
